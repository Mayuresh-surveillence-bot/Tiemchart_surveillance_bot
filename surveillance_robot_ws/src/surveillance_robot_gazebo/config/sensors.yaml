# Simulation assumptions, not specifications of confirmed hardware models.
# Mount positions remain in surveillance_robot_description/urdf/dimensions.xacro.
lidar:
  update_rate: 10.0
  samples: 720
  min_angle: -3.141592653589793
  # A half-degree step without duplicating the rear-facing endpoint.
  max_angle: 3.1328660073298216
  min_range: 0.12
  max_range: 12.0
  range_resolution: 0.01
  noise_stddev: 0.01

camera:
  update_rate: 15.0
  width: 640
  height: 480
  horizontal_fov: 1.3962634015954636  # 80 degrees; vertical FOV about 64.4 degrees.
  near_clip: 0.05
  far_clip: 20.0
  # Keep images noise-free during initial frame/transport validation.
  noise_stddev: 0.0

imu:
  update_rate: 50.0
  angular_velocity_noise_stddev: 0.002  # rad/s, independent per-axis Gaussian noise.
  linear_acceleration_noise_stddev: 0.02  # m/s^2, independent per-axis Gaussian noise.
